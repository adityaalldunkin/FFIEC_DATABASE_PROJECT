<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lenni — Loan Advisor Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f5f0;
      --surface: #fff;
      --text: #1a1a1a;
      --muted: #6b6560;
      --accent: #1f6b4a;
      --accent-soft: #e8f3ed;
      --border: #e5e0d8;
      --user-bg: #1f6b4a;
      --user-text: #fff;
      --bot-bg: #fff;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    header h1 {
      font-family: "DM Serif Display", Georgia, serif;
      font-size: 22px;
      font-weight: 400;
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 999px;
    }
    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 320px;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      gap: 0;
      min-height: 0;
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .side { display: none; }
    }
    .chat-main {
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 65px);
      border-right: 1px solid var(--border);
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .msg {
      max-width: 85%;
      padding: 14px 18px;
      border-radius: var(--radius);
      line-height: 1.55;
      font-size: 15px;
      white-space: pre-wrap;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user-bg);
      color: var(--user-text);
      border-bottom-right-radius: 4px;
    }
    .msg.bot {
      align-self: flex-start;
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .msg.bot h2, .msg.bot h3 { font-family: "DM Serif Display", serif; margin: 12px 0 6px; font-size: 17px; }
    .msg.bot h2:first-child, .msg.bot h3:first-child { margin-top: 0; }
    .msg.bot blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 12px;
      margin: 8px 0;
      color: var(--muted);
      font-style: italic;
    }
    .composer {
      padding: 16px 24px 24px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }
    .composer-row {
      display: flex;
      gap: 10px;
    }
    #input {
      flex: 1;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 15px;
      font-family: inherit;
      resize: none;
      min-height: 48px;
      max-height: 120px;
    }
    #input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 0 20px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { opacity: 0.92; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .side {
      padding: 20px;
      background: var(--surface);
      overflow-y: auto;
    }
    .side h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .slot-list { list-style: none; font-size: 13px; }
    .slot-list li {
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .slot-list .val { font-weight: 600; text-align: right; max-width: 55%; word-break: break-word; }
    .slot-list .missing { color: #c45; }
    .meta { font-size: 11px; color: var(--muted); margin-top: 16px; line-height: 1.5; }
    .typing { color: var(--muted); font-size: 13px; padding: 0 24px 8px; }
    .toolbar { display: flex; gap: 8px; margin-top: 10px; }
  </style>
</head>
<body>
  <header>
    <h1>Lenni Loan Advisor</h1>
    <span class="badge" id="providerBadge">connecting…</span>
  </header>
  <div class="layout">
    <div class="chat-main">
      <div id="messages"></div>
      <div class="typing" id="typing" hidden>Thinking…</div>
      <div class="composer">
        <div class="composer-row">
          <textarea id="input" rows="1" placeholder="Describe your deal…"></textarea>
          <button id="sendBtn" type="button">Send</button>
        </div>
        <div class="toolbar">
          <button type="button" class="secondary" id="resetBtn">New conversation</button>
        </div>
      </div>
    </div>
    <aside class="side">
      <h3>Deal profile</h3>
      <ul class="slot-list" id="slots"></ul>
      <p class="meta" id="meta"></p>
    </aside>
  </div>
  <script src="/static/chat-client.js"></script>
</body>
</html>
