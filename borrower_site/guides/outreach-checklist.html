<h1 class="serif">Bank outreach checklist</h1>
<p class="lead">Use before and during your Texas community bank search.</p>
<ul class="checklist checklist-print"><li><label><input type='checkbox' disabled/> Defined loan product and sub-type</label></li><li><label><input type='checkbox' disabled/> Checked product availability (wide vs narrow pool)</label></li><li><label><input type='checkbox' disabled/> Sized deal vs median bank exposure</label></li><li><label><input type='checkbox' disabled/> Built shortlist with ≥8% specialists</label></li><li><label><input type='checkbox' disabled/> Filtered out consumer-heavy banks</label></li><li><label><input type='checkbox' disabled/> Verified branch coverage in my market</label></li><li><label><input type='checkbox' disabled/> Prepared sub-type document checklist</label></li><li><label><input type='checkbox' disabled/> Drafted opening script from guide</label></li><li><label><input type='checkbox' disabled/> Listed 5 questions to ask each bank</label></li><li><label><input type='checkbox' disabled/> Set parallel outreach schedule (3 banks/week)</label></li><li><label><input type='checkbox' disabled/> Tracking responses in spreadsheet/CRM</label></li><li><label><input type='checkbox' disabled/> Comparing ≥3 term sheets before exclusivity</label></li></ul>
